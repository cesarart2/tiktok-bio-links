<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Continue to Wyld Notes — White Lie natural perfume</title>
<style>
  :root {
    --bg: #f6f8f9; --card: #ffffff; --text: #11231f; --muted: #5f7470;
    --accent-deep: #0d9488; --border: rgba(13, 148, 136, 0.14);
    --shadow: 0 1px 2px rgba(17,35,31,0.04), 0 6px 18px rgba(13,148,136,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    box-shadow: var(--shadow); padding: 28px 24px; max-width: 380px; width: 100%;
    text-align: center;
  }
  h1 { font-size: 19px; line-height: 1.35; font-weight: 700; margin-bottom: 8px; }
  .lead { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 20px; }
  .btn {
    display: block; background: var(--accent-deep); color: #fff; font-weight: 700;
    font-size: 15px; padding: 14px; border-radius: 13px; letter-spacing: 0.2px;
    text-decoration: none; transition: background .15s ease;
  }
  .btn:hover, .btn:active { background: #0b7d72; }
  .back { display: inline-block; margin-top: 16px; font-size: 13px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--accent-deep); }
  .disc { margin-top: 20px; font-size: 11px; color: var(--muted); line-height: 1.45; }
</style>
</head>
<body>
<main class="card">
  <h1>White Lie by Wyld Notes</h1>
  <p class="lead">Bergamot, jasmine and vetiver — 100% natural, no synthetics.<br>Your 10% is applied automatically at checkout.</p>
  <a class="btn" href="https://wyldnotes.com/discount/CESARADELAPIEDRA?ref=vdeuylhj" rel="nofollow sponsored noopener">Continue to Wyld Notes &rarr;</a>
  <a class="back" href="/shop/wellness/">&larr; Back to the shop</a>
  <p class="disc">#ad — I earn a commission on purchases made through this link, at no extra cost to you.</p>
</main>
</body>
</html>
