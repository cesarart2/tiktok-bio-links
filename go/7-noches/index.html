<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Duerme mejor en 7 noches: un paso cada noche — GRATIS</title>
<style>
  :root { --bg: #1c1612; --card: #2a211b; --fg: #f6efe4; --muted: #b9ab98; --accent: #c9a46a; --accent-fg: #1c1612; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--bg);
         color: var(--fg); -webkit-font-smoothing: antialiased; line-height: 1.5; padding: 24px 16px 40px;
         display: flex; justify-content: center; min-height: 100vh; }
  main { width: 100%; max-width: 420px; }
  .cover { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 16px; background: var(--card); }
  .tag { display: block; width: fit-content; margin: 16px auto 6px; font-size: 12px; font-weight: 800; letter-spacing: 2px;
         background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 3px 12px; }
  h1 { font-size: 22px; line-height: 1.25; text-align: center; }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 18px; }
  .btn { display: block; text-align: center; background: var(--accent); color: var(--accent-fg); font-weight: 700;
         font-size: 16px; border-radius: 12px; padding: 14px; text-decoration: none; }
  .card { background: var(--card); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
          border-radius: 16px; padding: 18px; margin-top: 16px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; }
  ol { list-style: none; counter-reset: s; }
  li { counter-increment: s; position: relative; padding-left: 34px; margin-bottom: 12px; font-size: 15px; }
  li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%;
               background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 13px; text-align: center; line-height: 24px; }
  /* Drawing of Gumroad's checkout box, so it looks familiar when they get there */
  .mock { margin: 6px 0 10px; background: #fff; color: #000; border: 1px solid #ddd; border-radius: 10px; padding: 12px; font-size: 13px; }
  .mock .field { margin-top: 6px; border: 2px solid #000; border-radius: 6px; padding: 6px 10px; color: #888; }
  .mock .field b { color: #e0115f; }
  .mock .buy { margin-top: 8px; background: #000; color: #fff; border: 2px solid #000; border-radius: 6px; padding: 7px; text-align: center; font-weight: 700; }
  .note { font-size: 13px; color: var(--muted); text-align: center; margin-top: 4px; }
  .bottom { margin-top: 16px; }
  .back { display: block; text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<main>
  <img class="cover" src="/comoentender/plan-7-noches.jpg" alt="Duerme mejor en 7 noches: un paso cada noche">
  <span class="tag">GRATIS</span>
  <h1>Duerme mejor en 7 noches: un paso cada noche</h1>
  <p class="sub">PDF gratis · 11 páginas · en español</p>
  <!-- Direct PDF (2026-11-07): Gumroad's email checkout got 39 views → 0 downloads.
       The PDF lives under /go/7-noches-pdf/ so the go-click-logger worker counts every open
       as slug "7-noches-pdf"; the script below forwards ?src= so the channel is kept. -->
  <a class="btn pdf" href="/go/7-noches-pdf/Plan-7-Noches-Dormir-Mejor.pdf">Descargar el plan gratis →</a>
  <p class="note">Se abre al momento. Guárdalo en tu teléfono o compártelo.</p>
  <p class="note">Sin correo. Sin pagos.</p>

  <a class="back" href="/comoentender/">← Volver</a>
</main>
<script>
  // Keep the visitor's source (?src=yt-ce-…, bio-comoentender) on the PDF click.
  var src = new URLSearchParams(location.search).get("src");
  if (src) document.querySelectorAll("a.pdf").forEach(function (a) {
    a.href += "?src=" + encodeURIComponent(src);
  });
</script>
</body>
</html>
